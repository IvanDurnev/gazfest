[group:gazfest]
programs=gazfest_web,gazfest_answers,gazfest_system
priority=200

[program:gazfest_web]
directory=/var/www/itd/gazfest
command=/usr/bin/prlimit --nofile=4096:4096 -- /var/www/itd/gazfest/venv/bin/gunicorn --workers 3 --threads 4 --worker-class gthread --bind 127.0.0.1:8020 --timeout 60 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile - wsgi:app
user=idurnev
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/var/www/itd/gazfest",PATH="/var/www/itd/gazfest/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/var/log/supervisor/gazfest/web.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/gazfest/web.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10

[program:gazfest_answers]
directory=/var/www/itd/gazfest
command=/usr/bin/prlimit --nofile=4096:4096 -- /var/www/itd/gazfest/venv/bin/celery -A app.celery_app.celery worker --loglevel=info --pool=threads --concurrency=40 --queues=answers --hostname=gazfest-answers@%%h
user=idurnev
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=180
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/var/www/itd/gazfest",PATH="/var/www/itd/gazfest/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/var/log/supervisor/gazfest/answers.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/gazfest/answers.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:gazfest_system]
directory=/var/www/itd/gazfest
command=/usr/bin/prlimit --nofile=4096:4096 -- /var/www/itd/gazfest/venv/bin/celery -A app.celery_app.celery worker --loglevel=info --pool=threads --concurrency=8 --queues=system --hostname=gazfest-system@%%h
user=idurnev
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/var/www/itd/gazfest",PATH="/var/www/itd/gazfest/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/var/log/supervisor/gazfest/system.out.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/gazfest/system.err.log
stderr_logfile_maxbytes=30MB
stderr_logfile_backups=10
